name: Template Checks

# Integrity checks for the .claude/ workflow (names, references, settings, hooks).
# Needs only bash, perl and jq, so it runs even before the project has a package.json.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    name: Skills integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check skills, commands, agents and settings
        run: scripts/check-skills.sh

      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
