name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skip the deploy until it is configured; no secret means a fresh project.
      - name: Check deploy secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VERCEL_TOKEN is not set; skipping deploy. Configure it or delete this workflow (README → Quick start → step 7)."
          fi

      - name: Setup Node.js
        if: steps.secrets.outputs.has == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.secrets.outputs.has == '1'
        run: npm ci

      - name: Build
        if: steps.secrets.outputs.has == '1'
        run: npm run build
        env:
          # Add your staging environment variables here
          # Reference them from GitHub Secrets / Variables
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}

      - name: Deploy to Vercel (Staging)
        if: steps.secrets.outputs.has == '1'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # No --prod flag = preview/staging deployment
