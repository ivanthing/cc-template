name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skip the rest only in the bare template (no package.json); a project with
      # package.json but no package-lock.json fails instead of passing unchecked.
      # hashFiles() is not allowed in a job-level if, so the check is a step.
      - name: Check for lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "has=1" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "::error::package.json without package-lock.json. Commit the lockfile, or edit ci.yml for your package manager."
            exit 1
          else
            echo "No package.json; skipping."
          fi

      - name: Setup Node.js
        if: steps.lock.outputs.has == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.lock.outputs.has == '1'
        run: npm ci

      - name: Lint
        if: steps.lock.outputs.has == '1'
        run: npm run lint

      - name: Type check
        if: steps.lock.outputs.has == '1'
        run: npx tsc --noEmit

      - name: Run tests
        if: steps.lock.outputs.has == '1'
        run: npm run test -- --coverage

      - name: Build
        if: steps.lock.outputs.has == '1'
        run: npm run build
