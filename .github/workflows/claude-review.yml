name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    name: Automated Code Review
    # Fork PRs get no secrets or OIDC token; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          # Subscription token from `claude setup-token`. For a shared team repo, use
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} instead (README, step 7).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only report bugs and security issues -- not style preferences
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs and security vulnerabilities only.
            Do NOT comment on code style, naming conventions, or formatting.
            Be concise. Only flag real problems that could affect correctness or security.
            For each issue found, explain: what the problem is, why it matters, and how to fix it.
            Leave each issue as an inline comment on the line it concerns; if there are no issues, say nothing.
          # Inline comments go through the action's MCP tool, which holds the token itself.
          # No `gh pr comment`: its --body-file flag can post any local file.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
