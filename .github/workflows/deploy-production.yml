name: Deploy to Production

on:
  # Manual trigger only — requires explicit team lead approval
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm production deployment"
        required: true

jobs:
  check-confirmation:
    name: Verify confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check input
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "Deployment cancelled. You must type DEPLOY to confirm."
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: check-confirmation
    environment: production  # Requires approval in GitHub environment settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skip the deploy until it is configured; no secret means a fresh project.
      - name: Check deploy secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VERCEL_TOKEN is not set; skipping deploy. Configure it or delete this workflow (README → Quick start → step 7)."
          fi

      - name: Setup Node.js
        if: steps.secrets.outputs.has == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.secrets.outputs.has == '1'
        run: npm ci

      - name: Build
        if: steps.secrets.outputs.has == '1'
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}

      - name: Deploy to Vercel (Production)
        if: steps.secrets.outputs.has == '1'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
