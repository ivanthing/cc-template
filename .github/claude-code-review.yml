# Claude Code automated PR review configuration
# Installed via: /install-github-app in Claude Code

# Focus only on bugs and security issues.
# Do not comment on style, formatting, or personal preferences.
# Be concise — one comment per issue, no essays.
review:
  instructions: |
    Review this PR for bugs and security vulnerabilities only.
    Do not comment on code style, naming conventions, or formatting.
    Be concise. If you find an issue, explain what it is and why it matters in 2-3 sentences.
    If there are no issues, say so briefly.
